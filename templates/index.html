<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RK FILMS - Watch & Download Movies</title>
    
    <!-- MONETAG VERIFICATION META TAG -->
    <meta name="monetag" content="bc4f1c774eeafef4f924f4d623e4e2c6">
    
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- MONETAG POP-UNDER SCRIPT -->
    <script src="https://alwingulla.com/88/tag.min.js" data-zone="11802298" async data-cfasync="false"></script>
</head>
<body>
    <header>
        <a href="/" class="logo">RK <span>FILMS</span></a>
        <form action="/" method="GET" class="search-bar">
            <input type="text" name="search" placeholder="Search movies..." value="{{ search }}">
            <button type="submit"><i class="fa-solid fa-magnifying-glass"></i></button>
        </form>
    </header>

    <div class="container">
        <!-- Category Filter Tabs -->
        <div class="category-tabs">
            <a href="/?category=All" class="tab-btn {% if current_category == 'All' %}active{% endif %}">All</a>
            <a href="/?category=Movie" class="tab-btn {% if current_category == 'Movie' %}active{% endif %}">Movie</a>
            <a href="/?category=TV Show" class="tab-btn {% if current_category == 'TV Show' %}active{% endif %}">TV Show</a>
            <a href="/?category=Anime" class="tab-btn {% if current_category == 'Anime' %}active{% endif %}">Anime</a>
        </div>

        <!-- Trending Section -->
        <h2 class="section-title">Trending</h2>
        <div class="movie-row">
            {% for movie in trending %}
            <div class="movie-card">
                <div class="card-img-wrapper">
                    <img src="{{ movie.poster }}" alt="{{ movie.title }}">
                    <a href="{{ url_for('watch', movie_id=movie.id) }}" class="play-overlay">
                        <i class="fa-solid fa-play"></i>
                    </a>
                </div>
                <div class="card-info">
                    <h3>{{ movie.title }}</h3>
                    <div class="card-meta">
                        <span>★ {{ movie.rating }}</span>
                        <span>{{ movie.year }}</span>
                    </div>
                </div>
            </div>
            {% else %}
            <p style="color: #666;">No movies found.</p>
            {% endfor %}
        </div>

        <!-- Latest Section -->
        <h2 class="section-title">Latest Releases</h2>
        <div class="movie-row">
            {% for movie in latest %}
            <div class="movie-card">
                <div class="card-img-wrapper">
                    <img src="{{ movie.poster }}" alt="{{ movie.title }}">
                    <a href="{{ url_for('watch', movie_id=movie.id) }}" class="play-overlay">
                        <i class="fa-solid fa-play"></i>
                    </a>
                </div>
                <div class="card-info">
                    <h3>{{ movie.title }}</h3>
                    <div class="card-meta">
                        <span>★ {{ movie.rating }}</span>
                        <span>{{ movie.year }}</span>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
</body>
</html>
