<script>
        const manifestUri = 'https://a96aivottlinear-a.akamaihd.net/OTTB/pdx-nitro/live/clients/dash/enc/r5nicrqiyf/out/v1/6659e5152b4e4bb89917f57640f594fb/cenc.mpd';

        async function initApp() {
            shaka.polyfill.installAll();
            if (shaka.Player.isBrowserSupported()) {
                initPlayer();
            } else {
                console.error('Browser not supported!');
            }
        }

        async function initPlayer() {
            const video = document.getElementById('live-video');
            const player = new shaka.Player(video);

            player.addEventListener('error', (event) => {
                console.error('Error code', event.detail.code, 'object', event.detail);
            });

            // Yahan humne wahi headers daal diye jo teri curl command mein hain
            player.getNetworkingEngine().registerRequestFilter((type, request) => {
                request.headers['Origin'] = 'https://sonucdn-v2.pages.dev';
                request.headers['Referer'] = 'https://sonucdn-v2.pages.dev/';
                request.headers['User-Agent'] = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:156.0) Gecko/20100101 Firefox/156.0';
            });

            try {
                await player.load(manifestUri);
                console.log('Stream loaded successfully using curl headers!');
            } catch (e) {
                console.error('Error loading manifest', e);
            }
        }

        document.addEventListener('DOMContentLoaded', initApp);
    </script>
